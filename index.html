<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Matches Analyzer - WARP Fixed</title>
<style>
body{background:#0e0e10;color:#fff;font-family:Arial;text-align:center;padding:20px}
#status{padding:12px;border-radius:8px;margin:10px;font-weight:bold;background:#400}
#status.online{background:#040}
button{background:#2a5bd7;color:white;border:none;padding:12px 25px;border-radius:8px;font-size:16px;margin:5px}
#log{background:#000;color:#0f0;text-align:left;padding:10px;height:250px;overflow:auto;border-radius:8px;margin-top:15px;font-family:monospace;font-size:12px}
select{padding:10px;border-radius:6px;margin:5px}
</style>
</head>
<body>
<h2>Deriv Matches Analyzer</h2>
<div id="status">🔴 Offline - Press Connect</div>
<div>
<select id="market"><option value="R_100">Volatility 100</option><option value="R_50">Volatility 50</option><option value="R_25">Volatility 25</option><option value="R_10">Volatility 10</option></select>
<select id="digit"><option value="0">Digit 0</option><option value="1">Digit 1</option><option value="2">Digit 2</option><option value="3">Digit 3</option><option value="4">Digit 4</option><option value="5">Digit 5</option><option value="6">Digit 6</option><option value="7">Digit 7</option><option value="8">Digit 8</option><option value="9">Digit 9</option></select>
</div>
<button id="connectBtn">Connect</button>
<button onclick="location.reload()">Reset</button>
<div>Matched: <span id="matched">0 / 0 = 0%</span> | Last: <span id="last">-</span></div>
<div id="log">Press Connect to start...<br></div>
<script>
let ws=null, total=0, matches=0;
const statusEl=document.getElementById('status'), logEl=document.getElementById('log'), matchedEl=document.getElementById('matched'), lastEl=document.getElementById('last'), btn=document.getElementById('connectBtn');
function log(m){logEl.innerHTML+=new Date().toLocaleTimeString()+' '+m+'<br>';logEl.scrollTop=logEl.scrollHeight;}
function updateStats(digit,lastDigit){
 total++; if(digit==lastDigit)matches++;
 let pct=total?((matches/total)*100).toFixed(1):0;
 matchedEl.textContent=`${matches} / ${total} = ${pct}%`;
 lastEl.textContent=lastDigit;
}
async function doConnect(){
 if(ws && ws.readyState===1){ws.close(); return;}
 const market=document.getElementById('market').value;
 const targetDigit=document.getElementById('digit').value;
 const endpoints=["wss://ws.derivws.com/websockets/v3?app_id=1089","wss://ws.binaryws.com/websockets/v3?app_id=1089","wss://ws.deriv.com/websockets/v3?app_id=1089"];
 statusEl.textContent="🟡 Connecting..."; statusEl.className=""; btn.textContent="Connecting..."; log(`WARP must be ON. Trying ${endpoints.length} endpoints...`);
 for(let url of endpoints){
   try{ await connectOne(url, market, targetDigit); return; }catch(e){ log(`❌ Failed ${url}: ${e.message}`); }
 }
 statusEl.textContent="🔴 All endpoints failed - Check WARP is Connected"; statusEl.className=""; btn.textContent="Connect"; log("💡 Make sure 1.1.1.1 WARP says Connected and try again");
}
function connectOne(url, market, targetDigit){
 return new Promise((resolve,reject)=>{
   log(`Trying: ${url}`);
   ws=new WebSocket(url);
   let timeout=setTimeout(()=>{ ws.close(); reject(new Error("Timeout 8s")); },8000);
   ws.onopen=()=>{ clearTimeout(timeout); log(`✅ Opened: ${url}`); statusEl.textContent="🟢 Online - Subscribing..."; statusEl.className="online"; ws.send(JSON.stringify({ticks:market})); btn.textContent="Disconnect"; resolve(); };
   ws.onmessage=(e)=>{
     try{
       const data=JSON.parse(e.data);
       if(data.tick){
         const quote=data.tick.quote.toString(); const lastDigit=quote.slice(-1);
         updateStats(targetDigit,lastDigit);
         if(total%5==0) log(`📈 ${data.tick.symbol} ${quote} -> last=${lastDigit} target=${targetDigit} ${lastDigit==targetDigit?'✅MATCH':'❌'}`);
         statusEl.textContent=`🟢 Online - ${data.tick.symbol}: ${quote}`;
       }else if(data.error){ log(`⚠️ API Error: ${data.error.message}`); }
     }catch(err){ log(`Raw: ${e.data.slice(0,100)}`); }
   };
   ws.onerror=()=>{ clearTimeout(timeout); log("❌ WebSocket error event"); reject(new Error("onerror")); };
   ws.onclose=(ev)=>{ clearTimeout(timeout); log(`🔌 Closed code=${ev.code} reason=${ev.reason||'none'}`); if(statusEl.textContent.includes("Connecting")){ reject(new Error(`closed ${ev.code}`)); }else{ statusEl.textContent=`🔴 Offline code ${ev.code}`; btn.textContent="Connect"; } };
 });
}
btn.onclick=doConnect;
</script>
</body>
</html>
