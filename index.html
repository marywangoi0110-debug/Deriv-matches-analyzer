<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Analyzer</title>
<style>
body{background:#0f1115;color:#fff;font-family:Arial;padding:15px}
button{padding:12px 22px;background:#00ff88;border:none;border-radius:6px;font-weight:bold;margin-right:8px}
select{padding:8px;border-radius:5px;margin-right:8px}
.card{background:#1a1d24;padding:12px;border-radius:8px;margin:12px 0}
#status{font-weight:bold;margin:10px 0}
</style>
</head>
<body>
<h2>Deriv Matches Analyzer</h2>
<div id="status">● Offline</div>

<div class="card">
<select id="symbol">
<option value="R_100">R_100</option>
<option value="R_100_1s">R_100_1s</option>
<option value="R_50">R_50</option>
<option value="R_25">R_25</option>
</select>

<select id="historySize">
<option value="100">100</option>
<option value="500">500</option>
<option value="1000" selected>1000</option>
</select>

<select id="targetDigit"></select>
<button onclick="connect()">Connect</button>
<button onclick="resetData()">Reset</button>
</div>

<div class="card">
<p>Selected: <span id="selectedDigit">-</span> | Rate: <span id="matchRate">0%</span></p>
<p>Current: <span id="currentDigit">-</span> | Count: <span id="ticksAnalyzed">0</span></p>
</div>

<div class="card" id="digitDist">Loading...</div>

<script src="app.js?v=10"></script>
</body>
</html>
