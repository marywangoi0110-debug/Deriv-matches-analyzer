<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Analyzer</title>
<style>body{background:#0F1115;color:#FFF;font-family:Arial;padding:10px}button{padding:10px;background:#0077FF;border:none;border-radius:5px;color:#FFF}select{padding:7px}#status{font-weight:bold}.card{background:#1A1D26;padding:10px;border-radius:10px;margin:10px 0}</style>
</head><body>
<h2>Deriv Matches Analyzer</h2>
<div id="status">Offline</div>
<div class="card">
<select id="symbol"><option value="R_100">R_100</option><option value="R_50">R_50</option><option value="R_25">R_25</option></select>
<select id="target"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select>
<button onclick="connect()">Connect</button>
<button onclick="location.reload()">Reset</button>
</div>
<div class="card">ID: <b id="curr">-</b> | Count: <b id="cnt">0</b> | Rate: <b id="rate">0%</b></div>
<div class="card" id="dist">Press Connect</div>
<script>
let ws,ticks=[];
function connect(){
 if(ws) ws.close();
 document.getElementById('status').textContent='Connecting...';
 document.getElementById('status').style.color='orange';
 ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{
  let s=document.getElementById('symbol').value;
  ws.send(JSON.stringify({ticks_history:s,count:1000,end:'latest',style:'ticks'}));
  ws.send(JSON.stringify({ticks:s,subscribe:1}));
 };
 ws.onmessage=(msg)=>{
  let d=JSON.parse(msg.data);
  if(d.history){ticks=d.history.prices.map(p=>{let q=(p.toString().split('.')[1]||'0').slice(-1);ticks.length>=1000&&ticks.shift();return parseInt(q)});}
  if(d.tick){let q=(d.tick.quote.toString().split('.')[1]||'0').slice(-1);ticks.length>=1000&&ticks.shift();ticks.push(parseInt(q));}
  let c=Array(10).fill(0);ticks.forEach(n=>c[n]++);let tot=ticks.length;
  document.getElementById('status').textContent='Connected ('+tot+')';document.getElementById('status').style.color='#00FF88';
  document.getElementById('curr').textContent=ticks.length?String(ticks[ticks.length-1]):'-';
  document.getElementById('cnt').textContent=tot;
  let tar=parseInt(document.getElementById('target').value);
  let rate=tot?(c[tar]/tot*100).toFixed(1):0;document.getElementById('rate').textContent=rate+'%';
  let h='';for(let i=0;i<10;i++){let pct=tot?(c[i]/tot*100).toFixed(1):0;h+=i+' : '+c[i]+' ('+pct+'%)<br>';}
  document.getElementById('dist').innerHTML=h;
 };
 ws.onerror=()=>{document.getElementById('status').textContent='Error - Use VPN';document.getElementById('status').style.color='red';};
 ws.onclose=()=>{document.getElementById('status').textContent='Offline';document.getElementById('status').style.color='red';};
}
</script>
</body></html>                                                                                                                            </html>ķo
