html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Analyzer - Fixed Kenya</title>
<style>
body{background:#0a0a0a;color:#0f0;font-family:monospace;padding:20px}
button{background:#0ff;color:#000;padding:10px 20px;border:none;cursor:pointer;font-weight:bold}
#status1{margin:10px 0;padding:10px;border:1px solid #0ff}
.log{background:#111;padding:10px;height:250px;overflow:auto;border:1px solid #333}
select{padding:8px;margin:5px;background:#222;color:#0f0;border:1px solid #0ff}
</style>
</head>
<body>
<h3>Deriv Matches Analyzer - Fixed (No VPN)</h3>
<select id="market"><option value="R_10">R_10</option><option value="R_25">R_25</option><option value="R_50">R_50</option><option value="R_100">R_100</option></select>
<select id="digit"><option value="0">0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select>
<button id="connectBtn">Connect</button>
<div id="status1">Disconnected</div>
<div id="log" class="log"></div>
<script>
const status1=document.getElementById('status1');
const btn=document.getElementById('connectBtn');
const logEl=document.getElementById('log');
function log(m){logEl.innerHTML+=m+"<br>";logEl.scrollTop=logEl.scrollHeight}
const endpoints=["wss://ws.derivws.com/websockets/v3?app_id=1089","wss://ws.deriv.com/websockets/v3?app_id=1089","wss://ws.derivws.com/websockets/v3?app_id=1089"];
function connectOne(url){return new Promise((res,rej)=>{const ws=new WebSocket(url);setTimeout(()=>res(ws),1000);ws.onerror=()=>rej(new Error("fail"))})}
btn.onclick=async()=>{
const target=document.getElementById('market').value;
status1.textContent="Connecting...";btn.textContent="Connecting...";log("Connecting to "+target);
for(let url of endpoints){try{log("Trying "+url);const ws=await connectOne(url);status1.textContent="Online 🟢 Connected";btn.textContent="Connected";log("SUCCESS "+url);ws.send(JSON.stringify({ticks:target,subscribe:1}));ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.tick)log("Tick "+d.tick.quote+" digit "+String(d.tick.quote).slice(-1))};return}catch(e){log("Failed "+url)}}
status1.textContent="All endpoints failed";btn.textContent="Retry";
}
</script>
</body>
</html>
