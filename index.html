<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Matches</title>
<style>
body{background:#0f1115;color:#fff;font-family:sans-serif;padding:15px;text-align:center}
#status{padding:10px;font-weight:bold;border-radius:6px;margin:10px 0}
button{padding:12px 18px;margin:5px;border:none;border-radius:8px;background:#2962ff;color:#fff;font-weight:bold;font-size:16px}
select{padding:10px;border-radius:6px;margin:5px}
#log{background:#1c1f2a;padding:10px;border-radius:8px;text-align:left;height:300px;overflow:auto;margin-top:10px}
</style>
</head>
<body>
<h2>Deriv Matches Analyzer</h2>
<div id="status" style="background:#400;color:#f88">● Offline - Press Connect</div>
<select id="market"><option value="R_100">Volatility 100</option><option value="R_50">Vol 50</option><option value="R_25">Vol 25</option><option value="R_10">Vol 10</option></select>
<select id="digit"><option value="0">Digit 0</option><option value="1">Digit 1</option><option value="2">Digit 2</option><option value="3">Digit 3</option><option value="4">Digit 4</option><option value="5">Digit 5</option><option value="6">Digit 6</option><option value="7">Digit 7</option><option value="8">Digit 8</option><option value="9">Digit 9</option></select>
<br>
<button onclick="connect()">Connect</button>
<button onclick="reset()">Reset</button>
<div>Matched: <span id="cnt">0</span> / <span id="tot">0</span> = <span id="rate">0%</span> | Last: <span id="last">-</span></div>
<div id="log">Press Connect to start...</div>
<script>
let ws, cnt=0, tot=0;
function connect(){
 document.getElementById('status').innerHTML='🟠 Connecting...'; document.getElementById('status').style.background='#432'; 
 document.getElementById('log').innerHTML='Connecting...\n'+document.getElementById('log').innerHTML;
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{ws.send(JSON.stringify({ticks:document.getElementById('market').value})); document.getElementById('status').innerHTML='🟢 Connected'; document.getElementById('status').style.background='#0a3'; document.getElementById('status').style.color='#fff';};
 ws.onmessage=(e)=>{let d=JSON.parse(e.data); if(d.tick){let p=d.tick.quote.toString(); let ld=parseInt(p.slice(-1)); let target=parseInt(document.getElementById('digit').value); tot++; document.getElementById('tot').innerText=tot; document.getElementById('last').innerText=ld+' ('+p+')'; let isMatch=ld==target; if(isMatch)cnt++; document.getElementById('cnt').innerText=cnt; document.getElementById('rate').innerText=(tot? (cnt/tot*100).toFixed(1):0)+'%'; let line=(isMatch?'✅ MATCH':'❌')+' '+p+' -> '+ld+' Target:'+target+' '+new Date().toLocaleTimeString(); document.getElementById('log').innerHTML=line+'\n'+document.getElementById('log').innerHTML; }};
 ws.onerror=()=>{document.getElementById('status').innerHTML='🔴 Error - Check WARP is ON'; document.getElementById('status').style.background='#400';};
 ws.onclose=()=>{document.getElementById('status').innerHTML='🔴 Offline'; document.getElementById('status').style.background='#400';};
}
function reset(){cnt=0;tot=0;document.getElementById('cnt').innerText=0;document.getElementById('tot').innerText=0;document.getElementById('rate').innerText='0%';document.getElementById('log').innerHTML='Reset done.'; if(ws)ws.close();}
document.getElementById('market').onchange=()=>{if(ws)ws.close(); setTimeout(connect,500);};
</script>
</body>
</html>
